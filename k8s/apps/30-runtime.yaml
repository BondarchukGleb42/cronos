apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronos-runtime
  namespace: cronos-bot
  labels:
    app.kubernetes.io/name: cronos-runtime
    app.kubernetes.io/part-of: cronos
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cronos-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronos-runtime
        app.kubernetes.io/part-of: cronos
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: cronos-runtime
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: image-pull-secret
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: cronos-app
          imagePullPolicy: IfNotPresent
          command: [python, -m, cronos.worker]
          env:
            - {name: ARTIFACTS_DIR, value: /data/artifacts}
            - {name: WORKER_CONCURRENCY, value: "2"}
            - {name: ALPHA_SOFT_LIMITS, value: "true"}
            - {name: LOG_LEVEL, value: INFO}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: DATABASE_URL}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: RABBITMQ_URL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: REDIS_URL}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: cronos-app, key: TELEGRAM_BOT_TOKEN}
            - name: TELEGRAM_PROXY
              valueFrom:
                secretKeyRef: {name: cronos-app, key: TELEGRAM_PROXY}
            - name: ALLTOKENS_API_KEY
              valueFrom:
                secretKeyRef: {name: cronos-app, key: ALLTOKENS_API_KEY}
            - name: ALLTOKENS_BASE_URL
              valueFrom:
                secretKeyRef: {name: cronos-app, key: ALLTOKENS_BASE_URL}
          resources:
            requests: {cpu: 150m, memory: 256Mi, ephemeral-storage: 128Mi}
            limits: {cpu: "1", memory: 1536Mi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: artifacts, mountPath: /data/artifacts}
            - {name: worker-tmp, mountPath: /tmp}
          startupProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/worker.healthy').st_mtime < 120"]
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/worker.healthy').st_mtime < 120"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/worker.healthy').st_mtime < 120"]
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
        - name: coordinator
          image: cronos-app
          imagePullPolicy: IfNotPresent
          command: [python, -m, cronos.coordinator]
          env:
            - {name: ARTIFACTS_DIR, value: /data/artifacts}
            - {name: ALPHA_SOFT_LIMITS, value: "true"}
            - {name: LOG_LEVEL, value: INFO}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: DATABASE_URL}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: RABBITMQ_URL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: REDIS_URL}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: cronos-app, key: TELEGRAM_BOT_TOKEN}
            - name: TELEGRAM_PROXY
              valueFrom:
                secretKeyRef: {name: cronos-app, key: TELEGRAM_PROXY}
            - name: ALLTOKENS_API_KEY
              valueFrom:
                secretKeyRef: {name: cronos-app, key: ALLTOKENS_API_KEY}
            - name: ALLTOKENS_BASE_URL
              valueFrom:
                secretKeyRef: {name: cronos-app, key: ALLTOKENS_BASE_URL}
          resources:
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 200m, memory: 192Mi, ephemeral-storage: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: artifacts, mountPath: /data/artifacts}
            - {name: coordinator-tmp, mountPath: /tmp}
          startupProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/coordinator.healthy').st_mtime < 120"]
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/coordinator.healthy').st_mtime < 120"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/coordinator.healthy').st_mtime < 120"]
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: cronos-artifacts
        - name: worker-tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: coordinator-tmp
          emptyDir: {sizeLimit: 64Mi}
