apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cronos-bot
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cronos-bot
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: cronos
        app.kubernetes.io/component: datastore
    spec:
      serviceAccountName: cronos-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          command: [sh, -c]
          args:
            - 'exec redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: REDIS_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 25m, memory: 32Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            exec: {command: [sh, -c, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
