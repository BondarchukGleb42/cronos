apiVersion: v1
kind: ConfigMap
metadata:
  name: cronos-rabbitmq-config
  namespace: cronos-bot
data:
  rabbitmq.conf: |
    listeners.tcp.default = 5672
    vm_memory_high_watermark.absolute = 192MiB
    disk_free_limit.absolute = 128MiB
    channel_max = 64
    heartbeat = 60
    log.console = true
    log.console.level = warning
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: cronos-bot
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: cronos-bot
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: cronos
        app.kubernetes.io/component: datastore
    spec:
      serviceAccountName: cronos-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine@sha256:3486d98205df3d6395ed70e7924baa13b561cbac54116c0ddae5b0b7382bbabd
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: cronos}
            - {name: RABBITMQ_DEFAULT_VHOST, value: cronos}
            - {name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS, value: "+S 1:1 +A 4"}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: cronos-infra, key: RABBITMQ_PASSWORD}
          ports:
            - {name: amqp, containerPort: 5672}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 500m, memory: 384Mi, ephemeral-storage: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: config
          configMap: {name: cronos-rabbitmq-config}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        namespace: cronos-bot
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: yc-network-hdd
        resources:
          requests: {storage: 1Gi}
