[project]
name = "cronos"
version = "0.1.0"
description = "Personal proactive Telegram agent"
requires-python = ">=3.14"
dependencies = [
  "aiogram>=3.31,<4",
  "aiohttp-socks>=0.10,<1",
  "aio-pika>=9.5,<10",
  "asyncpg>=0.31,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2,<3",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=6,<8",
  "uvicorn>=0.35,<1",
  "pillow>=11,<13",
  "pypdf>=6,<7",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4,<6",
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
  "reportlab>=4,<5",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1", "ty>=0.0.66,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cronos"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
